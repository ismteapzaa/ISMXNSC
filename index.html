<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ศึกสามฤดู ⚔️</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --spring: #f472b6; --summer: #f97316; --winter: #38bdf8;
            --gold: #f5a623; --gold2: #ffd700;
            --dark: #06061a; --dark2: #0a0a28;
            --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.08);
            --text: #e0e8ff; --muted: #6b7db3;
        }
        body {
            font-family:'Segoe UI',Tahoma,sans-serif; background:var(--dark); color:var(--text);
            min-height:100vh; overflow-x:hidden;
            background-image:
                radial-gradient(ellipse at 15% 50%, rgba(55,48,163,0.1) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 20%, rgba(109,40,217,0.07) 0%, transparent 50%);
        }
        #app { width:100%; min-height:100vh; position:relative; }
        .screen { display:none; width:100%; min-height:100vh; flex-direction:column; }
        .screen.active { display:flex; }

        /* ══ BARS ══ */
        .bar-wrap { background:rgba(0,0,0,0.5); border-radius:10px; height:14px; overflow:hidden; position:relative; }
        .bar-fill  { height:100%; border-radius:10px; transition:width 0.4s ease; position:relative; }
        .bar-fill::after { content:''; position:absolute; top:0; left:0; right:0; height:40%; background:rgba(255,255,255,0.15); border-radius:10px; }
        .hp-bar  { background:linear-gradient(90deg,#15803d,#22c55e,#4ade80); box-shadow:0 0 8px rgba(34,197,94,0.4); }
        .mp-bar  { background:linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa); box-shadow:0 0 8px rgba(59,130,246,0.4); }
        .ehp-bar { background:linear-gradient(90deg,#991b1b,#dc2626,#f97316); box-shadow:0 0 10px rgba(220,38,38,0.5); }

        .btn { display:block; width:100%; padding:14px; border:none; border-radius:12px;
               font-size:16px; font-weight:700; cursor:pointer; transition:all .2s;
               font-family:inherit; color:white; }
        .btn:active:not(:disabled) { transform:scale(0.96); }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .btn-gold {
            background:linear-gradient(135deg,#b45309,#d97706,#f59e0b);
            color:#1a0f00; box-shadow:0 4px 20px rgba(245,166,35,0.35);
        }
        .btn-gold:hover { box-shadow:0 6px 28px rgba(245,166,35,0.55); transform:translateY(-1px); }
        .btn-gray { background:rgba(255,255,255,0.08); border:1px solid var(--border); }
        .btn-gray:hover { background:rgba(255,255,255,0.12); }

        /* Transparent hit-box buttons over the background image */
        .ts-hitbox {
            position:absolute; background:transparent; border:none; cursor:pointer;
            border-radius:14px; transition:background .15s;
            /* Debug: uncomment to see hit areas */
            /* outline: 2px dashed rgba(255,0,0,0.4); */
        }
        .ts-hitbox:hover  { background:rgba(255,255,255,0.12); }
        .ts-hitbox:active { background:rgba(255,255,255,0.22); transform:scale(0.97); }
        .ts-hitbox:disabled { cursor:default; }
        /* Portrait-lock overlay (phones only) */
        .rotate-overlay {
            display:none; position:fixed; inset:0; z-index:99999;
            background:linear-gradient(135deg,#0a0a1e,#1a1040);
            flex-direction:column; align-items:center; justify-content:center;
            gap:16px; color:white; text-align:center; padding:30px;
        }
        .rotate-overlay .rot-icon { font-size:64px; animation:floatAnim 1.5s ease-in-out infinite; }
        .rotate-overlay .rot-text { font-size:18px; font-weight:700; color:#fde68a; }
        .rotate-overlay .rot-sub  { font-size:13px; color:rgba(255,255,255,0.7); }
        @media (orientation:portrait) and (max-width:900px) {
            .rotate-overlay { display:flex; }
        }

        /* ══ SEASON SELECT ══ */
        #seasonScreen { background:radial-gradient(ellipse at top, #0d0a2e 0%, var(--dark) 65%); }
        .season-inner { max-width:1100px; margin:0 auto; padding:24px; flex:1; overflow-y:auto; width:100%; }
        .page-title {
            font-size:clamp(18px,3vw,26px); font-weight:800; text-align:center;
            color:var(--gold); margin-bottom:24px; letter-spacing:1px;
            text-shadow:0 0 20px rgba(245,166,35,0.4);
        }
        #seasonCards { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:20px; }
        .season-card {
            background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
            border-radius:18px; overflow:hidden; cursor:pointer;
            transition:transform .2s, box-shadow .2s;
        }
        .season-card:hover:not(.locked) { transform:translateY(-3px); }
        .season-card.locked { opacity:0.4; cursor:not-allowed; }
        .sc-band { height:4px; width:100%; }
        .sc-body { padding:18px; }
        .sc-head  { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
        .sc-emoji { font-size:clamp(36px,5vw,48px); line-height:1; filter:drop-shadow(0 0 8px currentColor); }
        .sc-name  { font-size:clamp(16px,2.5vw,20px); font-weight:800; }
        .sc-info  { font-size:clamp(11px,1.5vw,13px); color:var(--muted); margin-top:3px; }
        .sc-lock  { margin-left:auto; font-size:20px; opacity:0.5; }
        .progress-row { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px; }
        .cleared-tag { margin-top:10px; font-size:12px; font-weight:700; }
        .hero-status-box {
            background:rgba(255,255,255,0.03); border:1px solid rgba(245,166,35,0.15);
            border-radius:16px; padding:16px;
        }
        .hs-title { font-size:13px; font-weight:700; color:var(--gold); margin-bottom:12px; letter-spacing:1px; }
        .bar-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }

        /* ══ BATTLE ══ */
        #battleScreen { padding:0; overflow:hidden; height:100vh; position:relative; }
        .bh {
            padding:10px 16px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(0,0,0,0.6); border-bottom:1px solid var(--border);
            flex-shrink:0; backdrop-filter:blur(10px);
        }
        .season-badge { font-size:12px; font-weight:700; padding:5px 14px; border-radius:20px; }
        .prog-text { font-size:12px; color:var(--muted); }

        /* Top info panels */
        .field-top {
            display:flex; gap:6px; padding:8px 10px 4px;
            position:relative; z-index:1; flex-shrink:0;
        }
        .fi-hero {
            flex:1; background:rgba(0,0,0,0.5); border:1px solid rgba(99,102,241,0.25);
            border-radius:10px; padding:6px 9px; backdrop-filter:blur(8px);
        }
        .fi-enemy {
            flex:1; background:rgba(0,0,0,0.5); border:1px solid rgba(220,38,38,0.25);
            border-radius:10px; padding:6px 9px; backdrop-filter:blur(8px); text-align:right;
        }
        .fi-hname  { font-size:10px; font-weight:800; color:#c7d2fe; margin-bottom:4px; }
        .fi-ename  { font-size:10px; font-weight:800; color:#fca5a5; margin-bottom:4px; }
        .fi-br { display:flex; align-items:center; gap:4px; margin-bottom:3px; }
        .fi-enemy .fi-br { flex-direction:row-reverse; }
        .fi-bar { flex:1; height:7px; }
        .fi-val { font-size:9px; color:var(--muted); min-width:42px; font-weight:600; }
        .fi-hero  .fi-val { text-align:right; }
        .fi-enemy .fi-val { text-align:left; }
        .fi-stats  { display:flex; gap:3px; margin-top:4px; }
        .fi-estats { display:flex; gap:3px; margin-top:4px; justify-content:flex-end; flex-wrap:wrap; }
        .stat-pill {
            background:rgba(255,255,255,0.07); border:1px solid var(--border);
            border-radius:6px; padding:2px 6px; font-size:10px; font-weight:700;
            display:flex; gap:3px; align-items:center;
        }
        .boss-tag {
            background:linear-gradient(135deg,#7f1d1d,#dc2626); color:white;
            font-size:9px; font-weight:800; padding:2px 8px; border-radius:20px;
            letter-spacing:2px; box-shadow:0 0 12px rgba(220,38,38,0.5);
            display:inline-block; margin-bottom:3px;
        }
        .status-indicator {
            font-size:9px; font-weight:700; padding:2px 6px;
            border-radius:20px; animation:pulse 0.9s ease-in-out infinite; display:inline-block;
        }
        .si-stun { color:#fbbf24; background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.3); }
        .si-weak { color:#86efac; background:rgba(134,239,172,0.1); border:1px solid rgba(134,239,172,0.3); }

        /* Arena floor — hero left vs enemy right */
        .arena-floor {
            flex:1; display:flex; align-items:flex-end; justify-content:space-between;
            padding:0 22% 200px; position:relative; z-index:1; overflow:hidden;
        }
        .arena-floor::after { content:''; display:none; }
        .arena-left  { display:flex; flex-direction:column; align-items:center; z-index:1; }
        .arena-right { display:flex; flex-direction:column; align-items:center; z-index:1; }

        .ah-sprite {
            font-size:clamp(130px,18vw,180px); line-height:1;
            animation:floatAnim 3s ease-in-out infinite;
            filter:drop-shadow(0 0 20px rgba(99,102,241,0.6));
        }
        .ah-halo {
            width:68px; height:10px; border-radius:50%; margin-top:2px;
            background:radial-gradient(ellipse,rgba(99,102,241,0.5) 0%,transparent 70%);
            box-shadow:0 0 10px rgba(99,102,241,0.4);
        }
        .e-sprite {
            font-size:clamp(130px,18vw,180px); line-height:1;
            animation:floatAnim 2.5s ease-in-out infinite;
            filter:drop-shadow(0 8px 28px rgba(0,0,0,0.7));
        }
        .e-sprite.boss { font-size:clamp(160px,22vw,216px); }
        .e-halo {
            width:110px; height:12px; border-radius:50%; margin-top:2px; flex-shrink:0;
            background:radial-gradient(ellipse,rgba(255,255,255,0.3) 0%,transparent 70%);
            box-shadow:0 0 18px rgba(255,255,255,0.18);
        }
        .char-hex { position:absolute; width:22vw; height:12.5vw; pointer-events:none; z-index:0; transform:translate(-50%,-50%); }
        #heroHex { left:12.9%; top:77%; filter:drop-shadow(0 0 8px rgba(99,102,241,0.55)); }
        #enemyHexSvg { left:86.1%; top:77%; }

        /* Log + buffs overlaid at bottom of arena */
        .arena-log {
            position:absolute; bottom:0; left:0; right:0; z-index:2;
        }

        /* ── Skill bar — fixed at very bottom ── */
        .skill-bar {
            position:absolute; bottom:16px; left:16px; z-index:10;
            display:flex; align-items:center; gap:8px;
            background:transparent; padding:0;
        }
        .skill-bar-sep { width:1px; height:50px; background:rgba(255,255,255,0.08); flex-shrink:0; }
        .item-circle-btn {
            width:58px; height:58px; border-radius:50%; flex-shrink:0;
            border:2px solid rgba(245,166,35,0.45);
            background:radial-gradient(circle at 40% 35%, rgba(30,20,0,0.95), rgba(6,6,26,0.98));
            color:var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center;
            cursor:pointer; font-family:inherit; transition:transform .15s, box-shadow .2s;
            box-shadow:0 0 14px rgba(245,166,35,0.12); padding:0;
        }
        .item-circle-btn:hover:not(:disabled) { transform:scale(1.1); box-shadow:0 0 22px rgba(245,166,35,0.28); }
        .item-circle-btn:active:not(:disabled) { transform:scale(0.88); }
        .item-circle-btn:disabled { opacity:0.3; cursor:not-allowed; }
        .icb-count { font-size:9px; font-weight:800; margin-top:1px; }

        .dmg-float {
            position:absolute; font-size:clamp(24px,5vw,32px); font-weight:900; pointer-events:none;
            animation:floatDmg 1.2s ease-out forwards; z-index:20;
            text-shadow:0 2px 8px rgba(0,0,0,0.8);
        }

        #dropToast {
            position:fixed; top:64px; left:50%; transform:translateX(-50%);
            background:rgba(6,6,26,0.96); border:1px solid var(--gold);
            border-radius:14px; padding:10px 20px; font-size:13px; color:#fde68a;
            z-index:100; display:none; animation:slideDown 0.4s ease; white-space:nowrap;
            box-shadow:0 4px 24px rgba(245,166,35,0.3);
        }

        /* Battle log */
        .blog {
            background:transparent;
            padding:8px 14px; height:78px; overflow-y:auto; font-size:11.5px; flex-shrink:0;
        }
        .log-p { color:#93c5fd; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }
        .log-e { color:#fca5a5; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }
        .log-s { color:#c4b5fd; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }
        .log-h { color:#6ee7b7; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }
        .log-i { color:#fde68a; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }
        .log-d { color:#fb923c; padding:1px 0; text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,0.85); }


        /* Buff / Debuff rows */
        .bdr { display:flex; flex-wrap:wrap; gap:4px; padding:4px 16px; min-height:24px; flex-shrink:0; }
        .chip { font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; white-space:nowrap; }
        .c-atk  { background:rgba(220,38,38,0.2);   color:#fca5a5; border:1px solid rgba(220,38,38,0.4); }
        .c-def  { background:rgba(59,130,246,0.2);  color:#93c5fd; border:1px solid rgba(59,130,246,0.4); }
        .c-dmg  { background:rgba(168,85,247,0.2);  color:#d8b4fe; border:1px solid rgba(168,85,247,0.4); }
        .c-imm  { background:rgba(251,191,36,0.15); color:#fde68a; border:1px solid rgba(251,191,36,0.4); }
        .c-poi  { background:rgba(34,197,94,0.15);  color:#86efac; border:1px solid rgba(34,197,94,0.4); }
        .c-burn { background:rgba(249,115,22,0.15); color:#fdba74; border:1px solid rgba(249,115,22,0.4); }
        .c-bled { background:rgba(239,68,68,0.15);  color:#fca5a5; border:1px solid rgba(239,68,68,0.4); }
        .c-atk_d{ background:rgba(185,28,28,0.15);  color:#fca5a5; border:1px solid rgba(185,28,28,0.4); }
        .c-def_d{ background:rgba(30,64,175,0.15);  color:#93c5fd; border:1px solid rgba(30,64,175,0.4); }
        .c-stun { background:rgba(217,119,6,0.15);  color:#fde68a; border:1px solid rgba(217,119,6,0.4); }
        .c-mp   { background:rgba(99,102,241,0.15); color:#a5b4fc; border:1px solid rgba(99,102,241,0.4); }

        /* ── Skill circles (inside skill-bar) ── */
        .skill-grid {
            display:flex; flex-direction:row; align-items:flex-start;
            gap:12px;
        }
        .sk-wrap { display:flex; flex-direction:column; align-items:center; gap:5px; }
        .sk-btn {
            width:62px; height:62px; border-radius:50%; flex-shrink:0;
            border:2px solid var(--sk-color, rgba(255,255,255,0.25));
            background:radial-gradient(circle at 40% 35%, rgba(20,20,55,0.96), rgba(6,6,26,0.98));
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; position:relative; padding:0; font-family:inherit;
            box-shadow:0 0 14px var(--sk-color,rgba(255,255,255,0.06)), inset 0 1px 0 rgba(255,255,255,0.07);
            transition:transform .15s, box-shadow .2s, border-color .15s;
        }
        .sk-btn::before { display:none; }
        .sk-btn:hover:not(:disabled) {
            transform:scale(1.12);
            box-shadow:0 0 24px var(--sk-color,rgba(255,255,255,0.2));
            border-color:var(--sk-color,rgba(255,255,255,0.6));
        }
        .sk-btn:active:not(:disabled) { transform:scale(0.88); }
        .sk-btn:disabled { opacity:0.3; cursor:not-allowed; }
        .sk-icon { font-size:26px; display:block; line-height:1; }
        .sk-mp {
            position:absolute; top:-7px; right:-7px;
            background:linear-gradient(135deg,#1e3a8a,#3b82f6); color:#fff;
            font-size:8px; font-weight:800; padding:2px 5px; border-radius:10px;
            border:1px solid rgba(255,255,255,0.15); pointer-events:none; white-space:nowrap;
        }
        .sk-mp.free { background:linear-gradient(135deg,#065f46,#10b981); }
        .sk-lbl {
            font-size:9px; font-weight:800; color:rgba(255,255,255,0.72);
            text-align:center; max-width:66px; line-height:1.2;
        }
        .sk-name { display:none; }
        .sk-desc { display:none; }


        /* ══ ITEM MODAL ══ */
        #itemModal, #heroModal, #encyclopediaModal {
            display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.75);
            justify-content:flex-end; align-items:stretch; flex-direction:column;
            backdrop-filter:blur(4px);
        }
        #itemModal.open, #heroModal.open, #encyclopediaModal.open { display:flex; }
        .modal-box {
            background:#0e0e2a; border-top:1px solid rgba(245,166,35,0.2);
            border-radius:22px 22px 0 0; max-height:75vh; display:flex;
            flex-direction:column; animation:slideUp 0.3s ease;
            max-width:600px; margin:0 auto; width:100%;
        }
        .modal-head {
            padding:18px 18px 14px; display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid var(--border);
        }
        .modal-title { font-size:16px; font-weight:800; color:var(--gold); letter-spacing:1px; }
        .modal-close {
            width:32px; height:32px; border:1px solid var(--border); border-radius:50%;
            background:var(--card); color:var(--muted); font-size:14px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .item-list { overflow-y:auto; padding:12px 16px 24px; flex:1; }
        .item-row {
            display:flex; align-items:center; gap:14px;
            background:rgba(255,255,255,0.04); border:1px solid var(--border);
            border-radius:14px; padding:14px; margin-bottom:10px;
            transition:border-color .15s;
        }
        .item-row:hover { border-color:rgba(245,166,35,0.3); }
        .item-emoji { font-size:30px; line-height:1; flex-shrink:0; }
        .item-info  { flex:1; min-width:0; }
        .item-name  { font-size:14px; font-weight:700; }
        .item-desc  { font-size:11px; color:var(--muted); margin-top:3px; }
        .item-cnt   { font-size:11px; color:#a78bfa; margin-top:3px; }
        .use-btn {
            padding:8px 16px; border:none; border-radius:10px;
            background:linear-gradient(135deg,#6d28d9,#7c3aed); color:white;
            font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
            transition:all .15s; flex-shrink:0; box-shadow:0 2px 10px rgba(124,58,237,0.4);
        }
        .use-btn:active { transform:scale(0.93); }
        .empty-bag { text-align:center; padding:36px 0; color:var(--muted); font-size:14px; }

        /* ══ RESULT ══ */
        #resultScreen {
            justify-content:center; align-items:center; text-align:center; padding:32px 24px;
            background:radial-gradient(ellipse at center, #1a0a4e 0%, var(--dark) 70%);
        }
        .result-content { max-width:480px; width:100%; }
        .res-icon  { font-size:clamp(72px,14vw,100px); margin-bottom:20px; animation:bounceIn .5s ease; filter:drop-shadow(0 0 20px rgba(245,166,35,0.4)); }
        .res-title { font-size:clamp(26px,5vw,36px); font-weight:900; margin-bottom:8px; }
        .res-sub   { font-size:clamp(13px,2vw,16px); color:var(--muted); margin-bottom:36px; line-height:1.8; }

        /* ══ CLEAR ══ */
        #clearScreen {
            justify-content:center; align-items:center; text-align:center; padding:32px 24px;
            background:radial-gradient(ellipse at center, #1a0a4e 0%, var(--dark) 70%);
        }
        .clear-content { max-width:500px; width:100%; }
        .clear-stars  { font-size:44px; letter-spacing:8px; animation:pulse 1.5s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(245,166,35,0.5)); }
        .clear-trophy { font-size:clamp(60px,11vw,88px); margin:14px 0; animation:floatAnim 2s ease-in-out infinite; filter:drop-shadow(0 0 20px rgba(245,166,35,0.4)); }
        .clear-title  { font-size:clamp(28px,6vw,40px); font-weight:900; color:var(--gold); margin-bottom:8px; text-shadow:0 0 20px rgba(245,166,35,0.4); }
        .clear-sub    { font-size:clamp(13px,2vw,16px); color:var(--muted); margin-bottom:10px; line-height:1.8; }
        .clear-stats  {
            background:rgba(255,255,255,0.04); border:1px solid rgba(245,166,35,0.15);
            border-radius:16px; padding:18px; margin:18px 0 28px;
            width:100%; font-size:14px; line-height:2.2; text-align:left;
        }

        @keyframes floatAnim   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
        @keyframes floatDmg   { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)} 100%{opacity:0;transform:translateX(-50%) translateY(-80px) scale(0.55)} }
        @keyframes shake      { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} }
        @keyframes heroAttack  { 0%{transform:translateX(0) scaleX(1)} 28%{transform:translateX(62px) scaleX(1.07)} 58%{transform:translateX(50px) scaleX(1.02)} 100%{transform:translateX(0) scaleX(1)} }
        @keyframes enemyAttack { 0%{transform:translateX(0) scaleX(1)} 28%{transform:translateX(-62px) scaleX(1.07)} 58%{transform:translateX(-50px) scaleX(1.02)} 100%{transform:translateX(0) scaleX(1)} }
        @keyframes heroHurt    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(10px)} 55%{transform:translateX(-10px)} 80%{transform:translateX(5px)} }
        @keyframes bounceIn  { 0%{transform:scale(0.3);opacity:0} 70%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
        @keyframes pulse     { 0%,100%{opacity:1} 50%{opacity:0.7} }
        @keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-14px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        @keyframes slideUp   { from{transform:translateY(100%)} to{transform:translateY(0)} }

        .blog::-webkit-scrollbar,.item-list::-webkit-scrollbar { width:3px; }
        .blog::-webkit-scrollbar-track,.item-list::-webkit-scrollbar-track { background:transparent; }
        .blog::-webkit-scrollbar-thumb,.item-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }

        /* ══ TABLET 768px+ ══ */
        @media(min-width:768px) {
            #seasonCards { grid-template-columns:repeat(3,1fr); }
            .e-sprite { font-size:clamp(100px,13vw,170px) !important; }
            .e-sprite.boss { font-size:clamp(130px,17vw,210px) !important; }
            .e-halo { width:150px; height:34px; }
            .ah-sprite { font-size:clamp(110px,13vw,150px) !important; }
            .ah-halo { width:80px; height:18px; }
            .blog { height:90px; font-size:12px; }
            .skill-grid { gap:20px; }
            .sk-btn { width:72px; height:72px; }
            .sk-icon { font-size:30px; }
            .sk-lbl { font-size:10px; max-width:76px; }
            .skill-bar { gap:8px; }
            .item-circle-btn { width:64px; height:64px; }
            .field-top { padding:10px 14px 6px; gap:10px; }
        }

        /* ══ DESKTOP 1200px+ ══ */
        @media(min-width:1200px) {
            .sk-btn { width:78px; height:78px; }
            .sk-icon { font-size:32px; }
            .sk-lbl { font-size:11px; max-width:82px; }
            .skill-grid { gap:24px; }
            .skill-bar { gap:10px; }
            .item-circle-btn { width:70px; height:70px; }
            .blog { height:100px; font-size:12.5px; }
        }

        /* ══ SMALL PHONE ══ */
        @media(max-width:360px) {
            .sk-btn { width:52px; height:52px; }
            .sk-icon { font-size:22px; }
            .sk-lbl { font-size:8px; max-width:56px; }
            .skill-grid { gap:8px; }
            .skill-bar { gap:6px; }
            .item-circle-btn { width:50px; height:50px; }
            .ah-sprite { font-size:70px !important; }
            .e-sprite { font-size:66px !important; }
        }

        /* ══ LANDSCAPE PHONE ══ */
        @media (orientation:landscape) and (max-height:500px) {
            body { overflow:hidden; }
            #app { height:100dvh; overflow:hidden; }
            .screen { min-height:0; height:100dvh; }
            #battleScreen { height:100dvh; }
            #titleScreen { overflow-y:auto; height:100dvh; justify-content:flex-start; padding:20px 24px; }
            #seasonScreen { overflow-y:auto; height:100dvh; }
            .season-inner { padding:16px; }
            #seasonCards { grid-template-columns:repeat(3,1fr); }

            .bh { padding:4px 14px; }

            /* Arena info panels compact */
            .field-top { padding:4px 8px 2px; gap:5px; }
            .fi-hero, .fi-enemy { padding:4px 7px; border-radius:8px; }
            .fi-hname, .fi-ename { font-size:8px; margin-bottom:2px; }
            .fi-br { margin-bottom:2px; }
            .fi-bar { height:5px; }
            .fi-stats, .fi-estats { margin-top:2px; gap:2px; }
            .stat-pill { padding:1px 5px; font-size:9px; }
            .status-indicator { font-size:8px; padding:1px 5px; }

            /* Sprites compact */
            .ah-sprite { font-size:clamp(60px,12vh,90px) !important; }
            .ah-halo { width:40px; height:9px; }
            .e-sprite { font-size:clamp(42px,13vh,62px) !important; }
            .e-sprite.boss { font-size:clamp(52px,16vh,78px) !important; }
            .e-halo { width:64px; height:13px; }
            .arena-floor { padding:0 8% 72px; }

            /* Log compact */
            .blog { height:40px; font-size:10px; padding:4px 10px; }
            .bdr { padding:2px 10px; min-height:14px; }

            /* Skill bar compact */
            .skill-bar { gap:6px; bottom:10px; left:10px; }
            .skill-grid { gap:8px; }
            .sk-btn { width:44px !important; height:44px !important; }
            .sk-icon { font-size:18px !important; }
            .sk-lbl { font-size:7.5px; max-width:48px; }
            .item-circle-btn { width:44px !important; height:44px !important; }
            .skill-bar-sep { height:38px; }
        }
    </style>
</head>
<body>
<!-- Portrait-lock overlay: shown on phones in portrait mode -->
<div class="rotate-overlay">
    <div class="rot-icon">📱</div>
    <div class="rot-text">กรุณาหมุนโทรศัพท์</div>
    <div class="rot-sub">เกมนี้รองรับเฉพาะแนวนอนเท่านั้น</div>
</div>
<div id="app">

    <!-- TITLE — IMG_0885 embedded as background, transparent hit boxes over each button -->
    <div id="titleScreen" class="screen" style="height:100vh">
        <button class="ts-hitbox" style="left:25%;top:25.5%;width:30%;height:10%" onclick="G.goSeasons()" aria-label="เริ่มต้นการเดินทาง"></button>
        <button class="ts-hitbox" style="left:25%;top:38.2%;width:30%;height:9.6%" onclick="G.showHeroLab()" aria-label="ห้องทดลองภูมิคุ้มกัน"></button>
        <button class="ts-hitbox" style="left:25%;top:50.5%;width:30%;height:9.6%" onclick="G.showEncyclopedia()" aria-label="สารานุกรมโรคระบาด"></button>
        <button class="ts-hitbox" disabled style="left:25%;top:62.9%;width:30%;height:9.8%" aria-label="ตั้งค่าระบบ"></button>
        <button class="ts-hitbox" style="left:25%;top:75%;width:30%;height:9.7%" onclick="if(confirm('ออกจากเกม?'))window.close()" aria-label="ออกจากเกม"></button>
        <button class="ts-hitbox" style="left:25%;top:86.3%;width:30%;height:10.2%" onclick="if(confirm('ออกจากเกม?'))window.close()" aria-label="ออกจากเกม 2"></button>
        <button class="ts-hitbox" disabled style="left:2%;top:87%;width:13%;height:11%" aria-label="ลงทะเบียน"></button>

    </div>

                    <div class="fi-br">
                        <span style="font-size:9px;flex-shrink:0">❤️</span>

                        <span style="font-size:9px;flex-shrink:0">💧</span>

                        <span class="fi-val" id="hMpTxt"></span>
                    </div>
                    <div class="fi-stats">
                        <div class="stat-pill">⚔️ <span id="hAtk"></span></div>
                        <div class="stat-pill">🛡️ <span id="hDef"></span></div>
                    </div>
                </div>
                <div class="fi-enemy">
                    <div id="bossTag"></div>
                    <div class="fi-ename" id="eName"></div>
                    <div class="fi-br">
                        <div class="bar-wrap fi-bar"><div class="bar-fill ehp-bar" id="eHpBar" style="width:100%"></div></div>
                        <span class="fi-val" id="eHpText"></span>

                    <div class="fi-estats">

    resAction=null; busy=false; totalKills=0; startTime=Date.now();
    inventory={}; itemsUsed=0; heroDebuffs=[];
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ─── Season Select ─── */
  function goSeasons() { clearInterval(mpRegenTimer); renderSeasonCards(); renderHeroStatus(); show('seasonScreen'); }

  function renderSeasonCards() {
    const el = document.getElementById('seasonCards');
    el.innerHTML = '';
    SEASONS.forEach((s,i)=>{
      const ok=unlocked[i], done=cleared[i], count=defeated[i], total=s.enemies.length;
      const card = document.createElement('div');
      card.className = 'season-card'+(ok?'':' locked');
      if(ok) {
        card.style.borderColor = s.color+'30';
        card.style.boxShadow = `0 0 20px ${s.color}12, inset 0 1px 0 ${s.color}20`;
        card.onclick = ()=>startSeason(i);
      }
      card.innerHTML = `
        <div class="sc-band" style="background:linear-gradient(90deg,${s.color},${s.color}88);box-shadow:0 0 10px ${s.color}55"></div>
        <div class="sc-body">
          <div class="sc-head">
            <div class="sc-emoji" style="color:${s.color}">${s.emoji}</div>
            <div>
              <div class="sc-name" style="color:${ok?s.color:'#4b5a7a'}">${s.name}</div>
              <div class="sc-info">มอนสเตอร์ ${total-1} ตัว + บอส 1 ตัว</div>
            </div>
            ${!ok?'<div class="sc-lock">🔒</div>':''}
          </div>
          ${ok?`
            <div class="progress-row"><span>ความคืบหน้า</span><span style="color:${s.color}">${count}/${total}</span></div>
            <div class="bar-wrap" style="height:6px"><div class="bar-fill" style="width:${(count/total)*100}%;background:${s.color};box-shadow:0 0 8px ${s.color}80"></div></div>
            ${done?`<div class="cleared-tag" style="color:${s.color}">✅ ผ่านแล้ว!</div>`:''}
          `:''}
        </div>`;
      el.appendChild(card);
    });
  }

  function renderHeroStatus() {
    const h=hero, el=document.getElementById('heroStatusEl');
    const items = Object.values(inventory).reduce((a,b)=>a+b,0);
    el.innerHTML = `
      <div style="display:flex;gap:14px;margin-bottom:10px">
        <div style="flex:1">
          <div class="bar-label"><span style="color:#6ee7b7">❤️ HP</span><span>${h.hp}/${h.maxHp}</span></div>
          <div class="bar-wrap" style="margin-top:5px"><div class="bar-fill hp-bar" style="width:${Math.max(0,h.hp/h.maxHp*100)}%"></div></div>
        </div>
        <div style="flex:1">
          <div class="bar-label"><span style="color:#93c5fd">💧 MP</span><span>${h.mp}/${h.maxMp}</span></div>
          <div class="bar-wrap" style="margin-top:5px"><div class="bar-fill mp-bar" style="width:${Math.max(0,h.mp/h.maxMp*100)}%"></div></div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <div class="stat-box" style="flex:none;padding:5px 14px">⚔️ ${h.atk}</div>
        <div class="stat-box" style="flex:none;padding:5px 14px">🛡️ ${h.def}</div>
        <div class="stat-box" style="flex:none;padding:5px 14px">🎒 ${items} ชิ้น</div>
      </div>`;
  }

  /* ─── Start Season ─── */
  function startSeason(idx) {
    season = idx;
    if(cleared[idx]) { hero.hp=hero.maxHp; hero.mp=hero.maxMp; hero.buffs=[]; heroDebuffs=[]; defeated[idx]=0; }
    else { hero.hp=hero.maxHp; hero.mp=hero.maxMp; }
    eIdx=0; spawnEnemy(0); show('battleScreen'); renderBattle();
    clearInterval(mpRegenTimer);
    mpRegenTimer = setInterval(()=>{
      if(hero && hero.hp>0){ hero.mp=Math.min(hero.maxMp,hero.mp+10); updateHHp(); }
    },1000);
  }

  function spawnEnemy(idx) {
    const raw = SEASONS[season].enemies[idx];
    enemy = { ...raw, maxHp:raw.hp, curHp:raw.hp, stunned:false, weakDef:0, weakTurns:0, atkBuff:0, atkBuffTurns:0 };
    eIdx = idx;
  }

  /* ─── Render Battle ─── */
  function renderBattle() {
    const s=SEASONS[season], e=enemy;
    const badge = document.getElementById('bSeasonBadge');
    badge.textContent = `${s.emoji} ${s.name}`;
    badge.style.cssText = `font-size:12px;font-weight:800;padding:5px 14px;border-radius:20px;background:${s.color}18;color:${s.color};border:1px solid ${s.color}40;letter-spacing:1px`;
    document.getElementById('bProgress').textContent = `${eIdx+1} / ${s.enemies.length}`;

    // Dynamic season glow on enemy zone
    const ez = document.getElementById('enemyZone');
    const TINTS=[
      'radial-gradient(ellipse at 50% 60%, rgba(6,182,212,0.22) 0%, rgba(6,182,212,0.08) 50%, transparent 80%)',
      'radial-gradient(ellipse at 55% 55%, rgba(249,115,22,0.28) 0%, rgba(239,68,68,0.14) 50%, transparent 80%)',
      'radial-gradient(ellipse at 50% 45%, rgba(147,197,253,0.25) 0%, rgba(56,189,248,0.12) 50%, transparent 80%)'
    ];
    ez.style.setProperty('--season-tint', TINTS[s.id]||TINTS[0]);

    // Halo color
    const halo = document.getElementById('eHalo');
    halo.style.boxShadow = `0 0 28px ${s.color}40`;
    halo.style.background = `radial-gradient(ellipse, ${s.color}30 0%, transparent 70%)`;

    // Enemy hex cell color per season
    const ehp = document.getElementById('enemyHexPoly');
    if(ehp){
      const rgb=hexToRgba(s.color);
      ehp.style.fill   = `rgba(${rgb},0.28)`;
      ehp.style.stroke = `rgba(${rgb},0.72)`;
      document.getElementById('enemyHexSvg').style.filter = `drop-shadow(0 0 6px rgba(${rgb},0.55))`;
    }

    document.getElementById('bossTag').innerHTML = e.isBoss?`<div class="boss-tag">⭐ BOSS ⭐</div>`:'';
    const sp = document.getElementById('eSprite');
    if (e.img) {
      sp.innerHTML = `<img src="data:image/webp;base64,${e.img}" style="height:1em;width:auto;display:block;object-fit:contain;image-rendering:auto">`;
    } else { sp.textContent = e.emoji; }
    sp.className = 'e-sprite' + (e.isBoss ? ' boss' : '');
    document.getElementById('eName').textContent = e.name;
    document.getElementById('stunIndicator').style.display='none';
    document.getElementById('weakIndicator').style.display='none';
    updateEHp(); updateHHp(); renderBuffs(); renderDebuffs(); renderSkills(true);
    document.getElementById('blog').innerHTML='';
    log(`${e.isBoss?'⭐ BOSS':'👾'} ${e.name} ปรากฏตัว!`+(e.sp?` — สกิลพิเศษ: ${e.sp.e}${e.sp.name}`:''),'s');
    busy=false;
  }

  function updateEHp() {
    const pct = Math.max(0,enemy.curHp/enemy.maxHp*100);
    document.getElementById('eHpText').textContent = `HP: ${Math.max(0,enemy.curHp)} / ${enemy.maxHp}`;
    document.getElementById('eHpBar').style.width = pct+'%';
  }

  function updateHHp() {
    const h=hero;
    document.getElementById('hHpTxt').textContent = `${Math.max(0,h.hp)}/${h.maxHp}`;
    document.getElementById('hMpTxt').textContent = `${h.mp}/${h.maxMp}`;
    document.getElementById('hHpBar').style.width = Math.max(0,h.hp/h.maxHp*100)+'%';
    document.getElementById('hMpBar').style.width = Math.max(0,h.mp/h.maxMp*100)+'%';
    document.getElementById('hAtk').textContent = h.atk;
    document.getElementById('hDef').textContent = h.def;
  }

  const BUFF_CSS = { atkMult:'c-atk', defBonus:'c-def', dmgMult:'c-dmg', stunImmune:'c-imm' };
  const DBF_CSS  = { poison:'c-poi', burn:'c-burn', bleed:'c-bled', atk_down:'c-atk_d', def_down:'c-def_d', stun:'c-stun', mp_drain:'c-mp' };
  const DBF_LBL  = { poison:'☠️ พิษ', burn:'🔥 ไฟ', bleed:'🩸 เลือด', atk_down:'⚔️↓', def_down:'🛡️↓', stun:'💫 Stun', mp_drain:'💧↓ MP' };

  function renderBuffs() {
    const cnt = Object.values(inventory).reduce((a,b)=>a+b,0);
    document.getElementById('itemCount').textContent = cnt>0?cnt:'';
    document.getElementById('itemBtnMain').disabled = busy||cnt===0;
    document.getElementById('buffRow').innerHTML = (hero.buffs||[]).map(b=>
      `<span class="chip ${BUFF_CSS[b.type]||'c-def'}">${b.emoji} ${b.label} (${b.turns})</span>`).join('');
  }

  function renderDebuffs() {
    document.getElementById('debuffRow').innerHTML = heroDebuffs.map(d=>{
      const label = DBF_LBL[d.t]||d.t;
      const val   = d.t==='atk_down'?`-${Math.round(d.v*100)}%`:d.t==='mp_drain'?`-${d.v}MP`:`${d.v}/T`;
      const turns = d.n>0?` (${d.n}T)`:'';
      return `<span class="chip ${DBF_CSS[d.t]||'c-poi'}">${label} ${val}${turns}</span>`;
    }).join('');
  }

  function renderSkills(enable) {
    const grid = document.getElementById('skillGrid');
    grid.innerHTML='';
    SKILLS.forEach((sk,i)=>{
      const can=sk.mp<=hero.mp;
      const wrap=document.createElement('div');
      wrap.className='sk-wrap';

      const btn=document.createElement('button');
      btn.className='sk-btn';
      btn.style.setProperty('--sk-color', sk.color);
      btn.disabled=!enable||busy||!can;
      btn.innerHTML=`<span class="sk-icon">${sk.emoji}</span><span class="sk-mp${sk.mp===0?' free':''}">${sk.mp===0?'ฟรี':sk.mp+'MP'}</span>`;
      btn.onclick=()=>useSkill(i);

      const lbl=document.createElement('div');
      lbl.className='sk-lbl';
      lbl.textContent=sk.name;

      wrap.appendChild(btn);
      wrap.appendChild(lbl);
      grid.appendChild(wrap);
    });
  }

  function lockSkills()   { busy=true;  renderSkills(false); renderBuffs(); }
  function unlockSkills() { busy=false; renderSkills(true);  renderBuffs(); }

  /* ─── Buff helpers ─── */
  function getAtkMult()  { return (hero.buffs||[]).filter(b=>b.type==='atkMult').reduce((a,b)=>a*b.value,1); }
  function getDmgMult()  { return (hero.buffs||[]).filter(b=>b.type==='dmgMult').reduce((a,b)=>a*b.value,1); }
  function getDefBonus() { return (hero.buffs||[]).filter(b=>b.type==='defBonus').reduce((a,b)=>a+b.value,0); }
  function hasStunImmune(){ return (hero.buffs||[]).some(b=>b.type==='stunImmune'); }
  function getAtkDown()  { return heroDebuffs.filter(d=>d.t==='atk_down').reduce((a,d)=>a*(1-d.v),1); }
  function getDefDown()  { return heroDebuffs.filter(d=>d.t==='def_down').reduce((a,d)=>a+d.v,0); }
  function isHeroStunned(){ return heroDebuffs.some(d=>d.t==='stun'); }

  function tickBuffs() {
    hero.buffs = (hero.buffs||[]).map(b=>({...b,turns:b.turns-1})).filter(b=>b.turns>0);
  }
  function tickDebuffs() {
    heroDebuffs = heroDebuffs.map(d=>d.n>0?{...d,n:d.n-1}:d).filter(d=>d.n>0);
    renderDebuffs();
  }
  function applyDoT() {
    let dot=0;
    heroDebuffs.filter(d=>['poison','burn','bleed'].includes(d.t)).forEach(d=>dot+=d.v);
    if(dot>0){ hero.hp=Math.max(0,hero.hp-dot); log(`☠️ สถานะเสีย → HP -${dot}`,'d'); updateHHp(); }
    return hero.hp>0;
  }
  function addDebuff(db) {
    if(db.t==='stun' && hasStunImmune()){ log('🛡️ วัคซีนกัน Stun!','h'); return; }
    if(db.t==='mp_drain'){ hero.mp=Math.max(0,hero.mp-db.v); log(`🌑 ดูดพลัง → MP -${db.v}`,'d'); updateHHp(); return; }
    const ex = heroDebuffs.find(d=>d.t===db.t);
    if(ex){ ex.n=Math.max(ex.n,db.n); ex.v=Math.max(ex.v,db.v); }
    else heroDebuffs.push({...db});
    renderDebuffs();
  }

  function updateWeakIndicator() {
    const el=document.getElementById('weakIndicator');
    if(enemy.weakTurns>0){ el.style.display='block'; el.textContent=`🎯 จุดอ่อน -${enemy.weakDef}DEF (${enemy.weakTurns}T)`; }
    else el.style.display='none';
  }

  /* ─── Combat ─── */
  function useSkill(i) {
    if(busy) return;
    const sk=SKILLS[i], h=hero, e=enemy;
    if(sk.mp>h.mp){ log('💧 MP ไม่พอ!','s'); return; }
    lockSkills();
    if(!applyDoT()){ setTimeout(onHeroDead,750); return; }
    if(isHeroStunned()){
      heroDebuffs=heroDebuffs.filter(d=>d.t!=='stun');
      log('💫 คุณถูก Stun! ข้ามเทิร์น','d');
      renderDebuffs(); h.mp=Math.min(h.maxMp,h.mp+18);
      setTimeout(enemyTurn,800); return;
    }
    h.mp -= sk.mp;
    if(sk.type==='barrier'){
      h.hp=Math.min(h.maxHp,h.hp+sk.heal);
      hero.buffs.push({type:'defBonus',value:40,turns:4,label:'DEF+40',emoji:'🛡️'});
      log(`🛡️ บาเรียภูมิคุ้มกัน → HP+${sk.heal} + DEF+40 (4T)`,'h');
      updateHHp(); floatDmg('+'+sk.heal,'#6ee7b7'); renderBuffs();
      setTimeout(enemyTurn,850); return;
    }
    const weak=e.weakDef||0;
    const atkVal=Math.floor(h.atk*getAtkMult()*getAtkDown()*sk.mult*getDmgMult());
    const vari=Math.floor(atkVal*0.15);
    const effDef=sk.type==='pierce'?Math.max(0,Math.floor(e.def*0.4)-weak):Math.max(0,e.def-weak);
    let dmg=Math.max(5,atkVal+rng(-vari,vari)-effDef);
    const crit=Math.random()<0.15; if(crit) dmg=Math.floor(dmg*1.5);
    e.curHp-=dmg;
    if(sk.type==='scan'){
      e.weakDef=(weak+8); e.weakTurns=3; updateWeakIndicator();
      log(`🔬 เซลล์ตรวจจับ → ${dmg}${crit?' 💥CRIT!':''} ┊ จุดอ่อน DEF-8 (3T)`,'p');
    } else if(sk.type==='pierce'){
      log(`⚔️ ดาบแอนติบอดี → ${dmg}${crit?' 💥CRIT!':''} ┊ ทะลุเกราะ 60%`,'p');
    } else if(sk.type==='drain'){
      const drain=Math.floor(dmg*0.25); h.hp=Math.min(h.maxHp,h.hp+drain);
      setTimeout(()=>floatDmg('+'+drain,'#6ee7b7'),300);
      log(`🌀 ผ้าคลุมเม็ดเลือด → ${dmg}${crit?' 💥CRIT!':''} ┊ ดูด HP+${drain}`,'p');
    }
    heroAttackAnim(); shakeEnemy(); floatDmg(dmg+(crit?'!!':''),crit?'#fbbf24':'#fca5a5');
    updateEHp(); updateHHp();
    if(e.curHp<=0){ setTimeout(onEnemyDead,800); return; }
    setTimeout(enemyTurn,950);
  }

  function enemyTurn() {
    const h=hero, e=enemy;
    if(e.stunned){
      e.stunned=false; document.getElementById('stunIndicator').style.display='none';
      log(`⭐ ${e.name} ถูก Stun! ข้ามเทิร์น`,'s');
      tickEnemyWeak(); tickBuffs(); tickDebuffs();
      h.mp=Math.min(h.maxMp,h.mp+18);
      setTimeout(unlockSkills,400); return;
    }
    const sp=e.sp, useSpecial=sp&&Math.random()<sp.ch;
    enemyAttackAnim();
    if(useSpecial){ setTimeout(shakeHero,250); doEnemySpecial(sp); }
    else {
      const atkTotal=e.atk+(e.atkBuff||0), vari=Math.floor(atkTotal*0.2);
      const defTot=Math.max(0,h.def+getDefBonus()-getDefDown());
      const dmg=Math.max(5,atkTotal+rng(-vari,vari)-defTot);
      h.hp=Math.max(0,h.hp-dmg);
      log(`${e.emoji} ${e.name} โจมตี → ${dmg}${getDefBonus()>0?' 🛡️':''}`, 'e');
      floatDmg('-'+dmg,'#fca5a5','hero');
      setTimeout(shakeHero,250); updateHHp();
    }
    if(e.atkBuffTurns>0){ e.atkBuffTurns--; if(e.atkBuffTurns<=0) e.atkBuff=0; }
    tickEnemyWeak(); tickBuffs(); tickDebuffs();
    h.mp=Math.min(h.maxMp,h.mp+18); renderBuffs();
    if(h.hp<=0){ setTimeout(onHeroDead,750); return; }
    setTimeout(unlockSkills,550);
  }

  function doEnemySpecial(sp) {
    const h=hero, e=enemy;
    const atkTotal=e.atk+(e.atkBuff||0), defTot=Math.max(0,h.def+getDefBonus()-getDefDown());
    switch(sp.type){
      case 'debuff':{ const d=Math.max(3,Math.floor(atkTotal*sp.pm+rng(-10,10))-defTot); h.hp=Math.max(0,h.hp-d); addDebuff(sp.db); log(`${sp.e} ${e.name} [${sp.name}] → ${d} + ${DBF_LBL[sp.db.t]||sp.db.t}!`,'d'); floatDmg('-'+d,'#f87171','hero'); updateHHp(); break; }
      case 'power':{ const d=Math.max(5,Math.floor(atkTotal*sp.pm+rng(-15,15))-defTot); h.hp=Math.max(0,h.hp-d); log(`${sp.e} ${e.name} [${sp.name}] → ${d}! 💥`,'d'); floatDmg('-'+d+'💥','#fb923c','hero'); updateHHp(); break; }
      case 'double':{ let t=0; for(let j=0;j<2;j++){ const d=Math.max(3,Math.floor(atkTotal*sp.pm+rng(-8,8))-defTot); t+=d; h.hp=Math.max(0,h.hp-d); } log(`${sp.e} ${e.name} [${sp.name}] → 2 ครั้ง รวม ${t}!`,'d'); floatDmg('-'+t,'#f87171','hero'); updateHHp(); break; }
      case 'triple':{ let t=0; for(let j=0;j<3;j++){ const d=Math.max(3,Math.floor(atkTotal*sp.pm+rng(-8,8))-defTot); t+=d; h.hp=Math.max(0,h.hp-d); } log(`${sp.e} ${e.name} [${sp.name}] → 3 ครั้ง รวม ${t}!`,'d'); floatDmg('-'+t,'#f87171','hero'); updateHHp(); break; }
      case 'selfheal':{ const ha=Math.floor(e.maxHp*sp.hp); e.curHp=Math.min(e.maxHp,e.curHp+ha); log(`${sp.e} ${e.name} [${sp.name}] → ฟื้น +${ha}!`,'d'); updateEHp(); floatDmg('+'+ha,'#6ee7b7','enemy'); const d=Math.max(3,Math.floor(atkTotal*0.5+rng(-5,5))-defTot); h.hp=Math.max(0,h.hp-d); floatDmg('-'+d,'#f87171','hero'); updateHHp(); break; }
      case 'selfbuff':{ e.atkBuff=(sp.ab||0); e.atkBuffTurns=(sp.bt||2); log(`${sp.e} ${e.name} [${sp.name}] → ATK+${sp.ab} (${sp.bt}T)!`,'d'); const d=Math.max(3,Math.floor(atkTotal*sp.pm+rng(-5,5))-defTot); h.hp=Math.max(0,h.hp-d); floatDmg('-'+d,'#f87171','hero'); updateHHp(); break; }
    }
  }

  function tickEnemyWeak() {
    if(enemy.weakTurns>0){ enemy.weakTurns--; if(enemy.weakTurns<=0) enemy.weakDef=0; updateWeakIndicator(); }
  }

  /* ─── Death ─── */
  function onEnemyDead() {
    const s=SEASONS[season], isLast=eIdx>=s.enemies.length-1;
    totalKills++; defeated[season]++;
    hero.mp=Math.min(hero.maxMp,hero.mp+35);
    rollDrops(enemy);
    if(isLast){
      cleared[season]=true; if(season<2) unlocked[season+1]=true;
      if(season===2) setTimeout(showClear,800);
      else { const ns=SEASONS[season+1]; setTimeout(()=>showResult('🎉',`${s.emoji} ${s.name} ผ่านแล้ว!`,`ปราบ ${s.name}สำเร็จ!\n${ns.emoji} ${ns.name} ถูกปลดล็อคแล้ว`,'➡️ ฤดูถัดไป','nextSeason'),900); }
    } else {
      const heal=Math.floor(hero.maxHp*0.08);
      hero.hp=Math.min(hero.maxHp,hero.hp+heal);
      log(`✅ ${enemy.name} พ่ายแพ้! ฟื้น HP+${heal}`,'h'); updateHHp();
      setTimeout(()=>{ spawnEnemy(eIdx+1); renderBattle(); unlockSkills(); },1400);
    }
  }
  function onHeroDead() {
    showResult('💀','คุณพ่ายแพ้...',`${enemy.name} เอาชนะคุณได้\nลองใหม่ตั้งแต่ต้นฤดูกาลนี้`,'🔄 ลองใหม่','retry');
  }

  /* ─── Items ─── */
  function rollDrops(e) {
    const sid=season, drops=[];
    ITEMS.forEach(item=>{
      if(item.bossOnly&&!e.isBoss) return;
      if(item.id==='healPotion'&&sid!==0) return;
      if(item.id==='ironShield'&&sid!==2) return;
      if(Math.random()<item.dropRate){
        if(item.type==='equip'){ hero.atk+=15; updateHHp(); drops.push(`${item.emoji} ${item.name}(ATK+15!)`); }
        else { inventory[item.id]=(inventory[item.id]||0)+1; drops.push(`${item.emoji} ${item.name}`); }
      }
    });
    if(drops.length) showDropToast(drops);
  }
  function showDropToast(drops) {
    const el=document.getElementById('dropToast');
    el.innerHTML='🎁 ดรอป: '+drops.join(' • ');
    el.style.display='block';
    setTimeout(()=>{ el.style.display='none'; },3000);
  }
  function showItems() { if(busy)return; renderItemList(); document.getElementById('itemModal').classList.add('open'); }
  function hideItems() { document.getElementById('itemModal').classList.remove('open'); }
  function renderItemList() {
    const list=document.getElementById('itemList');
    const keys=Object.keys(inventory).filter(k=>inventory[k]>0);
    if(!keys.length){ list.innerHTML='<div class="empty-bag">🎒 กระเป๋าว่างเปล่า<br><span style="font-size:12px">กำจัดศัตรูเพื่อเก็บไอเทม</span></div>'; return; }
    list.innerHTML=keys.map(id=>{
      const it=ITEMS.find(x=>x.id===id); if(!it)return'';
      return `<div class="item-row"><div class="item-emoji">${it.emoji}</div>
        <div class="item-info"><div class="item-name">${it.name}</div><div class="item-desc">${it.desc}</div><div class="item-cnt">มีอยู่: ${inventory[id]} ชิ้น</div></div>
        <button class="use-btn" onclick="G.useItem('${id}')">ใช้</button></div>`;
    }).join('');
  }
  function useItem(itemId) {
    const item=ITEMS.find(x=>x.id===itemId);
    if(!item||!inventory[itemId]||inventory[itemId]<=0)return;
    hideItems(); lockSkills();
    inventory[itemId]--; if(inventory[itemId]<=0) delete inventory[itemId];
    itemsUsed++;
    switch(item.type){
      case 'heal':{ const amt=Math.floor(hero.maxHp*0.5); hero.hp=Math.min(hero.maxHp,hero.hp+amt); heroDebuffs=heroDebuffs.filter(d=>!['poison','burn','bleed'].includes(d.t)); log(`${item.emoji} ${item.name} → HP+${amt} + ล้างสถานะ`,'i'); updateHHp(); floatDmg('+'+amt,'#6ee7b7'); renderDebuffs(); setTimeout(enemyTurn,850); break; }
      case 'buff':{ if(itemId==='warVaccine'){ hero.buffs.push({type:'dmgMult',value:1.5,turns:4,label:'DMG×1.5',emoji:'☠️'}); hero.buffs.push({type:'stunImmune',value:1,turns:4,label:'กัน Stun',emoji:'🛡️'}); } else if(itemId==='powerSerum'){ hero.buffs.push({type:'atkMult',value:1.2,turns:3,label:'ATK×1.2',emoji:'💉'}); } else if(itemId==='ironShield'){ hero.buffs.push({type:'defBonus',value:30,turns:5,label:'DEF+30',emoji:'🛡️'}); } log(`${item.emoji} ${item.name} → ${item.desc}`,'i'); renderBuffs(); setTimeout(enemyTurn,850); break; }
      case 'stun':{ enemy.stunned=true; document.getElementById('stunIndicator').style.display='block'; log(`${item.emoji} ดาวมึนงง → ศัตรูถูก Stun!`,'i'); setTimeout(enemyTurn,850); break; }
      case 'damage':{ const dmg=300; enemy.curHp-=dmg; log(`${item.emoji} ระเบิด → ${dmg}!`,'i'); heroAttackAnim(); shakeEnemy(); floatDmg(dmg+'','#fbbf24'); updateEHp(); if(enemy.curHp<=0){setTimeout(onEnemyDead,800);return;} setTimeout(enemyTurn,950); break; }
    }
  }

  /* ─── Result / Clear ─── */
  function showResult(icon,title,sub,btnTxt,action){
    document.getElementById('resIcon').textContent=icon;
    document.getElementById('resTitle').textContent=title;
    document.getElementById('resSub').innerHTML=sub.replace('\n','<br>');
    document.getElementById('resBtn').textContent=btnTxt;
    resAction=action; clearInterval(mpRegenTimer); show('resultScreen');
  }
  function doResult(){
    if(resAction==='retry'){ hero.hp=hero.maxHp; hero.mp=hero.maxMp; hero.buffs=[]; heroDebuffs=[]; defeated[season]=0; spawnEnemy(0); show('battleScreen'); renderBattle(); }
    else if(resAction==='nextSeason'){ hero.hp=hero.maxHp; hero.mp=hero.maxMp; hero.buffs=[]; heroDebuffs=[]; goSeasons(); }
  }
  function showClear(){
    clearInterval(mpRegenTimer);
    const secs=Math.floor((Date.now()-startTime)/1000);
    const mm=String(Math.floor(secs/60)).padStart(2,'0'), ss=String(secs%60).padStart(2,'0');
    document.getElementById('clearStats').innerHTML=`
      <div>⚔️ ศัตรูกำจัด: <strong style="color:var(--gold)">${totalKills} / 24</strong></div>
      <div>🕐 เวลา: <strong style="color:var(--gold)">${mm}:${ss}</strong></div>
      <div>❤️ HP เหลือ: <strong style="color:#4ade80">${Math.max(0,hero.hp)} / ${hero.maxHp}</strong></div>
      <div>🏺 เกราะโบราณ: <strong style="color:#c084fc">ATK +${hero.atk-BASE.baseAtk}</strong></div>
      <div>🎒 ไอเทมใช้ไป: <strong style="color:var(--gold)">${itemsUsed} ชิ้น</strong></div>`;
    show('clearScreen');
  }

  /* ─── Helpers ─── */
  function log(txt,cls){ const el=document.getElementById('blog'); const d=document.createElement('div'); d.className='log-'+cls; d.textContent=txt; el.appendChild(d); el.scrollTop=el.scrollHeight; }
  function floatDmg(txt,color,side){
    const zone=document.getElementById('enemyZone');
    const d=document.createElement('div'); d.className='dmg-float'; d.textContent=txt;
    d.style.color=color; d.style.textShadow=`0 0 16px ${color},0 2px 4px rgba(0,0,0,0.8)`;
    if(side==='hero'){
      const sp=document.getElementById('ahSprite');
      if(sp){
        const zr=zone.getBoundingClientRect(), sr=sp.getBoundingClientRect();
        d.style.left=((sr.left+sr.right)/2-zr.left)/zr.width*100+'%';
        d.style.top=((sr.top+sr.bottom)/2-zr.top)/zr.height*100+'%';
      } else { d.style.left='13%'; d.style.top='50%'; }
    } else if(txt.startsWith('+') && side!=='enemy'){
      d.style.left='25%'; d.style.top='50%';
    } else {
      const sp=document.getElementById('eSprite');
      if(sp){
        const zr=zone.getBoundingClientRect(), sr=sp.getBoundingClientRect();
        d.style.left=((sr.left+sr.right)/2-zr.left)/zr.width*100+'%';
        d.style.top=((sr.top+sr.bottom)/2-zr.top)/zr.height*100+'%';
      } else { d.style.left='68%'; d.style.top='50%'; }
    }
    zone.appendChild(d); setTimeout(()=>d.remove(),1300);
  }
  function shakeEnemy(){ const sp=document.getElementById('eSprite'); sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='shake 0.4s ease'; setTimeout(()=>sp.style.animation='floatAnim 2.5s ease-in-out infinite',500); }
  function shakeHero(){ const sp=document.getElementById('ahSprite'); if(!sp) return; sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='heroHurt 0.4s ease'; setTimeout(()=>sp.style.animation='floatAnim 3s ease-in-out infinite',500); }
  function heroAttackAnim(){ const sp=document.getElementById('ahSprite'); if(!sp) return; sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='heroAttack 0.48s ease-out'; setTimeout(()=>sp.style.animation='floatAnim 3s ease-in-out infinite',580); }
  function enemyAttackAnim(){ const sp=document.getElementById('eSprite'); if(!sp) return; sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='enemyAttack 0.48s ease-out'; setTimeout(()=>sp.style.animation='floatAnim 2.5s ease-in-out infinite',580); }
  function rng(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function hexToRgba(h){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `${r},${g},${b}`; }
  function restart(){ init(); show('titleScreen'); }

  function showHeroLab() {
    const h=hero, items=Object.values(inventory).reduce((a,b)=>a+b,0);
    const stat=(emoji,lbl,val,max,col)=>`<div style="flex:1;min-width:90px;background:rgba(255,255,255,0.05);border-radius:12px;padding:12px 8px;text-align:center"><div style="font-size:10px;color:#64748b;margin-bottom:4px">${emoji} ${lbl}</div><div style="font-size:17px;font-weight:800;color:${col}">${val}${max!=null?`<span style='font-size:11px;color:#475569'>/${max}</span>`:''}</div></div>`;
    document.getElementById('heroModalContent').innerHTML=`
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        ${stat('❤️','HP',h.hp,h.maxHp,'#f87171')}
        ${stat('💧','MP',h.mp,h.maxMp,'#60a5fa')}
        ${stat('⚔️','ATK',h.atk,null,'#fb923c')}
        ${stat('🛡','DEF',h.def,null,'#34d399')}
      </div>
      <div style="font-size:11px;color:#475569;font-weight:700;letter-spacing:1px;margin-bottom:8px">สกิล</div>
      ${SKILLS.map(sk=>`<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:11px 14px;margin-bottom:7px"><span style="font-size:26px;line-height:1">${sk.emoji}</span><div><div style="font-weight:700;color:#e2e8f0;font-size:13px">${sk.name}</div><div style="font-size:11px;color:#94a3b8;margin-top:2px">${sk.desc}</div></div></div>`).join('')}
      <div style="font-size:11px;color:#475569;font-weight:700;letter-spacing:1px;margin:12px 0 6px">ไอเทมในกระเป๋า: ${items} ชิ้น</div>
    `;
    document.getElementById('heroModal').classList.add('open');
  }
  function hideHeroLab(){ document.getElementById('heroModal').classList.remove('open'); }

  function showEncyclopedia() {
    document.getElementById('encyclopediaContent').innerHTML=SEASONS.map(s=>`
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:${s.color};margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid ${s.color}30">${s.emoji} ${s.name}</div>
        ${s.enemies.map(e=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:4px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06)"><span style="font-size:22px">${e.emoji}</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#e2e8f0">${e.name}${e.isBoss?' ⭐':''}</div><div style="font-size:11px;color:#64748b;margin-top:2px">HP ${e.maxHp||e.hp} · ATK ${e.atk} · DEF ${e.def}</div></div>${e.isBoss?`<div style="font-size:10px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2);border-radius:6px;padding:2px 6px">BOSS</div>`:''}</div>`).join('')}
      </div>
    `).join('');
    document.getElementById('encyclopediaModal').classList.add('open');
  }
  function hideEncyclopedia(){ document.getElementById('encyclopediaModal').classList.remove('open'); }

  init();
  show('titleScreen');
  return { goSeasons, doResult, restart, showItems, hideItems, useItem, showHeroLab, hideHeroLab, showEncyclopedia, hideEncyclopedia };
})();
</script>
</body>
</html>
